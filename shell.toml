# Banished — shell surfaces and borders.
# Window border size and corner radius are set in hyprland.lua.
# Palette values copied from the existing active theme.

[bar]
background       = "#0c0b0d"
background-alpha = 1.0
text             = "#e4e2e6"
active           = "#ff4a78"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border-width = 1
active-border            = "rgba(8f57ffb3) rgba(8f57ffb3) rgba(8f57ffb3) rgba(e4e4e4b3) rgba(e4e4e4b3) rgba(e4e4e4b3) 270deg"
active-border-foreground = "rgba(e4e4e4b3)"
soft-border = "rgba(8f57ffb3) rgba(e4e4e4b3) 270deg"

[controls]

normal-color        = "#e4e2e6"
normal-fill-alpha   = 0.04
normal-border       = "#e4e2e6"
normal-border-width = 1
normal-border-alpha = 0.4

hover-cursor-color        = "#e4e2e6"
hover-cursor-fill-alpha   = 0.08
hover-cursor-border       = "#e4e2e6"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.25

focus-color        = "#e4e2e6"
focus-fill-alpha   = 0.08
focus-border       = "#e4e2e6"
focus-border-width = 1
focus-border-alpha = 0.25

selected-color        = "#e4e2e6"
selected-fill-alpha   = 0.18
selected-border       = "#e4e2e6"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
border-width = 1
background       = "#0c0b0d"
background-alpha = 1.0
text             = "#e4e2e6"
border           = "hyprland.active-border"
border-alpha     = 1.0

[tooltip]
border-width = 1
background       = "#0c0b0d"
background-alpha = 0.97
text             = "#e4e2e6"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
floating-shadow = true
border-width = 1
background       = "#0c0b0d"
background-alpha = 1.0
text             = "#e4e2e6"
border           = "hyprland.soft-border"
border-alpha     = 1.0
countdown        = "#ff2fb3"

[launcher]
border-width = 1
background                = "#0c0b0d"
background-alpha          = 0.95
text                      = "#e4e2e6"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#0c0b0d"
scrim-alpha               = 0.5
selected-background       = "#e4e2e6"
selected-background-alpha = 0.08
selected-text             = "#ff2fb3"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.25

[menu]
compact = true
width = 295
border-radius = 4
extra-bottom-padding = 4
floating-shadow = true
shadow-opacity = 0.4
shadow-spread = 0
border-width = 1
background                = "#0c0b0d"
background-alpha          = 1.0
text                      = "#e4e2e6"
border                    = "hyprland.active-border"
border-alpha              = 1.0
scrim                     = "#0c0b0d"
scrim-alpha               = 0.0
selected-background       = "#ff2fb3"
selected-background-alpha = 0.0
selected-text             = "#ff2fb3"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.0
selected-border-width     = 0

[polkit]
border-width = 1
background       = "#0c0b0d"
background-alpha = 1.0
text             = "#e4e2e6"
text-error       = "#ff4a78"
border           = "hyprland.active-border"
border-error     = "#ff4a78"
border-alpha     = 1.0
scrim            = "#0c0b0d"
scrim-alpha      = 0.5
accent           = "#ff2fb3"

[lock]
border-width = 1
background       = "#0c0b0d"
background-alpha = 1.0
text             = "#e4e2e6"
placeholder      = "#9b999c"
text-error       = "#ff4a78"
border           = "hyprland.soft-border"
border-active    = "hyprland.soft-border"
border-error     = "#ff4a78"
border-alpha     = 1.0
selection        = "#ff2fb3"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#0c0b0d"
scrim-alpha             = 0.5
text                    = "#e4e2e6"
selected-border         = "#ff2fb3"
selected-border-alpha   = 1.0
unselected-border       = "#e4e2e6"
unselected-border-alpha = 0.28

# Shared by the local menu, notification and OSD plugins.
[floating-shadow]
blur = 18
opacity = 0.55
offset-y = 2

[osd]
floating-shadow = true
border-width = 1
border = "hyprland.soft-border"
border-alpha = 1.0
